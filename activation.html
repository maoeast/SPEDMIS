<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统激活</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e5799, #2989d8, #207cca, #7db9e8);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        
        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        
        .activation-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 80%;
            max-width: 500px;
            text-align: center;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: fadeIn 1s ease;
        }
        
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-20px);}
            to {opacity: 1; transform: translateY(0);}
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 28px;
            position: relative;
            display: inline-block;
        }
        
        h2:after {
            content: '';
            position: absolute;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #3498db, transparent);
            bottom: -10px;
            left: 20%;
        }
        
        .machine-code-container {
            position: relative;
            margin: 20px 0;
        }
        
        .machine-code {
            background: #f5f5f5;
            padding: 15px;
            padding-right: 160px;
            min-height: 56px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            color: #2c3e50;
            border: 1px solid #ddd;
            word-break: break-all;
            animation: pulse 2s infinite;
            text-align: left;
        }
        
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 999px;
            min-width: 120px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            color: #3498db;
            transition: all 0.2s ease;
            padding: 0 14px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .copy-btn:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
        }
        
        .copy-btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        
        .copy-success {
            position: absolute;
            top: -30px;
            right: 0;
            background: rgba(46, 204, 113, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .copy-success.show {
            opacity: 1;
            animation: fadeOut 2s forwards;
        }
        
        @keyframes fadeOut {
            0% {opacity: 1;}
            70% {opacity: 1;}
            100% {opacity: 0;}
        }
        
        @keyframes pulse {
            0% {box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.4);}
            70% {box-shadow: 0 0 0 10px rgba(52, 152, 219, 0);}
            100% {box-shadow: 0 0 0 0 rgba(52, 152, 219, 0);}
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .activation-code-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
            margin: 15px 0;
        }

        .activation-code-row input[type="text"] {
            flex: 1;
            margin: 0;
        }
        
        input[type="text"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
            outline: none;
        }
        
        button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-weight: bold;
        }
        
        button:hover {
            background: linear-gradient(135deg, #2980b9, #3498db);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .secondary-btn {
            margin-top: 0;
            white-space: nowrap;
            background: linear-gradient(135deg, #6c7a89, #4f6272);
        }

        .secondary-btn:hover {
            background: linear-gradient(135deg, #4f6272, #6c7a89);
        }
        
        .error {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 14px;
            background: rgba(231, 76, 60, 0.1);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            10%, 30%, 50%, 70%, 90% {transform: translateX(-5px);}
            20%, 40%, 60%, 80% {transform: translateX(5px);}
        }
        
        .contact-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .company-name {
            font-weight: bold;
            color: #2c3e50;
        }

        @media (max-width: 560px) {
            .activation-code-row {
                flex-direction: column;
            }

            .secondary-btn {
                width: 100%;
            }

            .machine-code {
                padding-right: 15px;
                padding-top: 60px;
            }

            .copy-btn {
                left: 10px;
                right: auto;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="activation-container">
        <h2>特殊教育多模态干预系统激活</h2>
        <p>请复制下方机器码，并联系我们获取激活码</p>
        <div class="machine-code-container">
            <div class="machine-code" id="machineCode">正在生成机器码...</div>
            <button class="copy-btn" onclick="copyMachineCode()" title="复制机器码">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                    <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                </svg>
                <span>复制机器码</span>
            </button>
            <div class="copy-success" id="copySuccess">已复制!</div>
        </div>
        <button type="button" id="retryMachineCodeButton" class="secondary-btn" onclick="loadMachineCode()" style="display: none;">
            重新获取机器码
        </button>
        <div class="activation-code-row">
            <input type="text" id="activationCode" placeholder="请输入64位激活码">
            <button
                type="button"
                id="pasteActivationCodeButton"
                class="secondary-btn"
                onclick="pasteActivationCode()"
            >
                粘贴激活码
            </button>
        </div>
        <button type="button" id="importLisButton" class="secondary-btn" onclick="importLisFile()">
            导入激活文件(.lis)
        </button>
        <input type="file" id="lisFileInput" accept=".lis" style="display: none;">
        <button onclick="activate()">提交激活</button>
        <div class="error" id="errorMessage"></div>
        <div class="contact-info">
            <p>获取激活码请联系：</p>
            <p class="company-name">杭州炫灿科技有限公司</p>
            <p>电话：0571-86087889</p>
        </div>
    </div>

    <script>
        // 机器码加载：主进程整体采集上限 15s，渲染层等待 20s；
        // 5s 后仍未返回时提示正在读取，避免用户误以为卡死。
        const MACHINE_CODE_HINT_DELAY_MS = 5000;
        let machineCodeHintTimer = null;

        function clearMachineCodeHintTimer() {
            if (machineCodeHintTimer) {
                clearTimeout(machineCodeHintTimer);
                machineCodeHintTimer = null;
            }
        }

        function loadMachineCode() {
            const machineCodeElement = document.getElementById('machineCode');
            const retryButton = document.getElementById('retryMachineCodeButton');

            machineCodeElement.textContent = '正在生成机器码...';
            retryButton.style.display = 'none';
            clearMachineCodeHintTimer();
            machineCodeHintTimer = setTimeout(() => {
                if (getMachineCodeText() === '正在生成机器码...') {
                    machineCodeElement.textContent = '正在读取硬件信息，请稍候…（首次读取可能需要几秒）';
                }
            }, MACHINE_CODE_HINT_DELAY_MS);

            if (!window.electronAPI || typeof window.electronAPI.getMachineCode !== 'function') {
                clearMachineCodeHintTimer();
                machineCodeElement.textContent = '无法生成机器码';
                showError('当前环境不支持获取机器码');
                retryButton.style.display = 'block';
                return;
            }

            window.electronAPI.getMachineCode()
                .then(machineCode => {
                    clearMachineCodeHintTimer();
                    machineCodeElement.textContent = machineCode;
                })
                .catch(error => {
                    clearMachineCodeHintTimer();
                    machineCodeElement.textContent = '无法生成机器码';
                    showError(`错误：${error.message}`);
                    retryButton.style.display = 'block';
                });
        }

        window.onload = function() {
            loadMachineCode();
        };
        
        function getMachineCodeText() {
            return document.getElementById('machineCode').textContent.trim();
        }

        function hasReadyMachineCode() {
            return /^[a-f0-9]{64}$/i.test(getMachineCodeText());
        }

        // 复制机器码到剪贴板
        function copyMachineCode() {
            if (hasReadyMachineCode()) {
                navigator.clipboard.writeText(getMachineCodeText())
                    .then(() => {
                        const copySuccess = document.getElementById('copySuccess');
                        copySuccess.classList.add('show');
                        setTimeout(() => {
                            copySuccess.classList.remove('show');
                        }, 2000);
                    })
                    .catch(err => {
                        showError('复制失败，请手动复制');
                        console.error('复制失败:', err);
                    });
            } else {
                showError('机器码尚未生成，无法复制');
            }
        }

        function pasteActivationCode() {
            if (!navigator.clipboard || typeof navigator.clipboard.readText !== 'function') {
                showError('当前环境不支持直接粘贴，请手动输入激活码');
                return;
            }

            navigator.clipboard.readText()
                .then(pastedText => {
                    if (!pastedText || !pastedText.trim()) {
                        showError('剪贴板为空，请先复制激活码');
                        return;
                    }

                    document.getElementById('activationCode').value = pastedText.trim();
                })
                .catch(error => {
                    showError('粘贴失败，请手动输入激活码');
                    console.error('粘贴失败:', error);
                });
        }

        // 导入激活文件(.lis)
        function importLisFile() {
            document.getElementById('lisFileInput').click();
        }

        document.getElementById('lisFileInput').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            // 无论成功失败都重置，允许再次选择同一文件
            event.target.value = '';

            if (!file) {
                return;
            }

            if (!file.name.toLowerCase().endsWith('.lis')) {
                showError('请选择 .lis 激活文件');
                return;
            }

            let text;
            try {
                text = await file.text();
            } catch (error) {
                showError('读取激活文件失败，请重试');
                console.error('读取激活文件失败:', error);
                return;
            }

            if (!window.electronAPI || typeof window.electronAPI.parseActivationLis !== 'function') {
                showError('当前环境不支持导入激活文件');
                return;
            }

            const result = await window.electronAPI.parseActivationLis(text);
            if (!result || !result.success) {
                showError(result && result.error ? result.error : '激活文件解析失败');
                return;
            }

            const fileMachineCode = result.data.machineCode;
            if (!hasReadyMachineCode()) {
                showError('机器码尚未生成，请稍后重试');
                return;
            }
            const currentMachineCode = getMachineCodeText();
            if (fileMachineCode !== currentMachineCode) {
                showError('激活文件与当前电脑不匹配（机器码不一致），请联系客服重新获取');
                return;
            }

            // 自动填入激活码并提交激活
            document.getElementById('activationCode').value = result.data.activationCode;
            activate();
        });

        function activate() {
            const activationCode = document.getElementById('activationCode').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            
            if (activationCode.length !== 64) {
                showError('激活码长度不正确，请输入64位激活码');
                return;
            }
            
            // 调用主进程进行激活
            window.electronAPI.activate({ activationCode: activationCode })
                .then(result => {
                    if (result && result.success) {
                        // 激活成功，显示成功消息并跳转首页
                        showSuccess();
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        showError('激活失败，请检查激活码是否正确');
                    }
                })
                .catch(error => {
                    showError(error.message);
                });
        }
        
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            
            // 添加抖动动画
            errorMessage.style.animation = 'none';
            setTimeout(() => {
                errorMessage.style.animation = 'shake 0.5s';
            }, 10);
        }
        
        function showSuccess() {
            // 创建成功消息元素
            const successMessage = document.createElement('div');
            successMessage.textContent = '激活成功！正在跳转到主界面...';
            successMessage.style.backgroundColor = 'rgba(46, 204, 113, 0.1)';
            successMessage.style.color = '#2ecc71';
            successMessage.style.padding = '15px';
            successMessage.style.borderRadius = '8px';
            successMessage.style.marginTop = '15px';
            successMessage.style.animation = 'fadeIn 0.5s';
            
            // 替换错误消息
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.style.display = 'none';
            errorMessage.parentNode.insertBefore(successMessage, errorMessage.nextSibling);
        }
    </script>
</body>
</html>
